name: devctl verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devctl-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Verify _devctl through devctl
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Bootstrap devctl
        run: go build -ldflags "-X devctl/internal/version.Commit=${{ github.sha }}" -o devctl ./cmd/devctl

      - name: Verify repository through the agent boundary
        shell: bash
        run: |
          result_path="${RUNNER_TEMP}/devctl-agent-result.json"
          stderr_path="${RUNNER_TEMP}/devctl-agent-stderr.log"
          set +e
          ./devctl verify --agent . >"${result_path}" 2>"${stderr_path}"
          verify_exit=$?
          set -e
          python3 scripts/validate-agent-result.py \
            --result "${result_path}" \
            --stderr "${stderr_path}" \
            --commit "${GITHUB_SHA}"
          test "${verify_exit}" -eq 0

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devctl-evidence-${{ github.run_id }}
          path: |
            .devctl/evidence/
            ${{ runner.temp }}/devctl-agent-result.json
            ${{ runner.temp }}/devctl-agent-stderr.log
          if-no-files-found: error
